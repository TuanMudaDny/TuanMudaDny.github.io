<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halaman Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f4;
            margin: 0;
        }
        .login-box {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 300px;
            text-align: center;
        }
        input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            width: 100%;
            padding: 10px;
            background: #007BFF;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background: #0056b3; }
        #pesan-error {
            color: red;
            display: none;
            margin-top: 15px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>Login Akses</h2>
        <input type="text" id="username" placeholder="Username">
        <input type="password" id="password" placeholder="Password">
        <button onclick="cekLogin()">Login</button>
        <p id="pesan-error">Password/Username Salah..!!</p>
    </div>

    <script>
        function cekLogin() {
            var user = document.getElementById("username").value;
            var pass = document.getElementById("password").value;
            var errorMsg = document.getElementById("pesan-error");

            if (user === "Admin" && pass === "P@ssw0rd1") {
                // Arahkan ke halaman utama jika sukses
                window.location.href = "utama.html"; 
            } else {
                // Tampilkan pesan error jika salah
                errorMsg.style.display = "block";
            }
        }
    </script>

</body>
</html>
