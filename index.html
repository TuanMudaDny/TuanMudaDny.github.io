
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login WEB</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #141e30, #243b55);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            background: white;
            width: 320px;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            text-align: center;
        }

        h2 {
            color: #243b55;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            background: #243b55;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #141e30;
        }

        #pesan {
            color: red;
            margin-top: 15px;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="login-box">
    <h2>LOGIN WEB</h2>

    <input type="text" id="username"
           placeholder="Username">

    <input type="password" id="password"
           placeholder="Password">

    <button onclick="login()">LOGIN</button>

    <p id="pesan"></p>
</div>

<script>
    function login() {

        let username = document.getElementById("username").value;
        let password = document.getElementById("password").value;

        if (username === "Admin" && password === "P@ssw0rd1") {

            window.location.href = "utama.html";

        } else {

            document.getElementById("pesan").innerHTML =
                "Password/Username Salah..!!";

        }
    }
</script>

</body>
</html>
