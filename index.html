<!DOCTYPE html>

        body { 
            font-family: Arial, sans-serif; 
            background-color: #f4f4f9;

            height: 100vh; 
            margin: 0; 
        }
        .container { 
            background: white; 
            padding: 30px; 
            border-radius: 8px; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.1); 
            width: 100%; 
            max-width: 400px; 
        }
        .hidden { display: none; }
        .error { color: #d93025; font-size: 14px; margin-bottom: 15px; font-weight: bold; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { 
            width: 100%; 
            padding: 10px; 
            background: #0d6efd; 
            color: white; 
            border: none; 
            border-radius: 4px; 
            cursor: pointer; 
            font-weight: bold; 
        }
        button:hover { background: #0b5ed7; }
        .btn-danger { background: #dc3545; margin-top: 20px; }
        .btn-danger:hover { background: #bb2d3b; }
    </style>
</head>
