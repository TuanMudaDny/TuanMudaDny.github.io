<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Website TuanMuda</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f9;
            margin: 0;
        }
        .login-box {
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            text-align: center;
            width: 300px;
        }
        input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #0056b3;
        }
        #error-msg {
            color: red;
            font-size: 14px;
            display: none; /* Disembunyikan secara default */
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>Menu Login</h2>
        <form id="formLogin">
            <input type="text" id="username" placeholder="Username" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit">Login</button>
            <p id="error-msg">Password/Username Salah..!!</p>
        </form>
    </div>

    <script>
        document.getElementById('formLogin').addEventListener('submit', function(event) {
            event.preventDefault(); // Mencegah halaman termuat ulang saat tombol ditekan

            // Mengambil nilai input
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const errorMsg = document.getElementById('error-msg');

            // Cek kecocokan username dan password
            if (user === 'Admin' && pass === 'P@ssw0rd1') {
                // Jika benar, arahkan ke file halaman utama (misal: utama.html)
                window.location.href = 'utama.html';
            } else {
                // Jika salah, tampilkan pesan error
                errorMsg.style.display = 'block';
            }
        });
    </script>

</body>
</html>
